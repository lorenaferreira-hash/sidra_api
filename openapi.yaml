openapi: 3.0.3
info:
  title: SIDRA API Corrigida
  version: "1.2.0"
  description: |
    API para consulta de dados do IBGE/SIDRA. 
    INSTRUÇÕES IMPORTANTES:
    1. Sempre consulte '/metadados/{tabela_id}' para descobrir as variáveis agregadas (classificações).
    2. Para incluir variáveis agregadas no Excel, use o parâmetro 'classificacoes' no formato 'cID:CAT1,CAT2|cID2:CAT3'.
    3. O link 'download_url' deve ser exibido para o usuário como um link clicável para baixar o arquivo Excel.
servers:
  - url: https://sidra-api.onrender.com
paths:
  /municipio/buscar:
    get:
      operationId: buscarMunicipio
      parameters:
        - name: nome
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lista de municípios
  /grupos:
    get:
      operationId: listarGrupos
      responses:
        "200":
          description: Grupos de tabelas
  /grupos/{grupo_id}/tabelas:
    get:
      operationId: listarTabelasGrupo
      parameters:
        - name: grupo_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tabelas do grupo
  /metadados/{tabela_id}:
    get:
      operationId: obterMetadados
      parameters:
        - name: tabela_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Metadados e variáveis agregadas (classificações)
  /gerar_excel:
    get:
      operationId: gerarExcel
      parameters:
        - name: tabela
          in: query
          required: true
          schema:
            type: string
        - name: municipio
          in: query
          required: true
          schema:
            type: string
        - name: periodos
          in: query
          schema:
            type: string
            default: all
        - name: variaveis
          in: query
          schema:
            type: string
            default: allxp
        - name: classificacoes
          in: query
          schema:
            type: string
          description: "Formato: cID:CAT1,CAT2. Ex: c1:1,2|c2:0"
      responses:
        "200":
          description: Link de download e preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  download_url:
                    type: string
                    description: "URL direta para o usuário baixar o Excel"
                  preview:
                    type: array
                    items:
                      type: object
  /download/{file_id}:
    get:
      operationId: downloadArquivo
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Arquivo Excel
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
