{
  "openapi": "3.1.0",
  "info": {
    "title": "IBGE SIDRA GPT API",
    "description": "API para buscar dados do IBGE SIDRA seguindo o fluxo do script original.",
    "version": "1.1.0"
  },
  "servers": [
    {
      "url": "https://sidra-api.onrender.com"
    }
  ],
  "paths": {
    "/grupos": {
      "get": {
        "summary": "Listar Grupos de Análise",
        "description": "Primeiro passo: Lista os grupos disponíveis (Saneamento, Renda, etc).",
        "operationId": "listarGrupos",
        "responses": {
          "200": { "description": "Sucesso" }
        }
      }
    },
    "/grupos/{grupo_id}/tabelas": {
      "get": {
        "summary": "Listar Tabelas do Grupo",
        "description": "Segundo passo: Lista as tabelas disponíveis para o grupo escolhido.",
        "operationId": "listarTabelasGrupo",
        "parameters": [
          {
            "name": "grupo_id",
            "in": "path",
            "required": true,
            "schema": { "type": "string" }
          }
        ],
        "responses": {
          "200": { "description": "Sucesso" }
        }
      }
    },
    "/municipio/buscar": {
      "get": {
        "summary": "Buscar Código do Município",
        "description": "Transforma o nome de uma cidade no código IBGE necessário.",
        "operationId": "buscarMunicipio",
        "parameters": [
          {
            "name": "nome",
            "in": "query",
            "required": true,
            "schema": { "type": "string" }
          }
        ],
        "responses": {
          "200": { "description": "Sucesso" }
        }
      }
    },
    "/metadados/{tabela_id}": {
      "get": {
        "summary": "Obter Metadados e Períodos",
        "description": "Terceiro passo: Mostra variáveis, anos disponíveis e classificações da tabela.",
        "operationId": "obterMetadados",
        "parameters": [
          {
            "name": "tabela_id",
            "in": "path",
            "required": true,
            "schema": { "type": "string" }
          }
        ],
        "responses": {
          "200": { "description": "Sucesso" }
        }
      }
    },
    "/gerar_excel": {
      "get": {
        "summary": "Gerar e Baixar Excel",
        "description": "Passo final: Gera o arquivo Excel com os parâmetros escolhidos.",
        "operationId": "gerarExcel",
        "parameters": [
          { "name": "tabela", "in": "query", "required": true, "schema": { "type": "string" } },
          { "name": "municipio", "in": "query", "required": true, "schema": { "type": "string" } },
          { "name": "periodos", "in": "query", "schema": { "type": "string", "default": "all" } },
          { "name": "variaveis", "in": "query", "schema": { "type": "string", "default": "allxp" } },
          { "name": "classificacoes", "in": "query", "schema": { "type": "string" } }
        ],
        "responses": {
          "200": { "description": "Sucesso" }
        }
      }
    }
  }
}
